global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: mediamtx
    metrics_path: /metrics
    static_configs:
      - targets:
          - mediamtx:9998
        labels:
          namespace: streaming
          pod: mediamtx
