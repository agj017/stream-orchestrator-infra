apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: orchestrator
  labels:
    app: outbox-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
    spec:
      containers:
        - name: outbox-publisher
          image: agj017/funnel-outbox-publisher:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: DB_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: RABBITMQ_URL
