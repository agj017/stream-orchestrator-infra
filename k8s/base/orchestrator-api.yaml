apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-api
  namespace: orchestrator
  labels:
    app: orchestrator-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-api
  template:
    metadata:
      labels:
        app: orchestrator-api
    spec:
      containers:
        - name: orchestrator-api
          image: agj017/funnel-orchestrator-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: DB_URL
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-api
  namespace: orchestrator
  labels:
    app: orchestrator-api
spec:
  selector:
    app: orchestrator-api
  ports:
    - name: http
      port: 8080
      targetPort: http
