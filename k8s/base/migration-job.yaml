apiVersion: batch/v1
kind: Job
metadata:
  name: stream-orchestrator-migrate
  namespace: orchestrator
  labels:
    app: stream-orchestrator-migrate
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: stream-orchestrator-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: stream-orchestrator/migrator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: DB_URL
          args:
            - -path=/migrations
            - -database=$(DB_URL)
            - up
