apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: orchestrator
data:
  RABBITMQ_EXCHANGE: stream.events
  RABBITMQ_PROVISION_QUEUE: stream.provision
  RABBITMQ_STREAM_CREATED_ROUTING_KEY: stream.created
  RABBITMQ_STREAM_STOP_REQUESTED_ROUTING_KEY: stream.stop_requested
  OUTBOX_POLL_INTERVAL: 500ms
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_MAX_RETRY: "20"
  PROMETHEUS_URL: http://prometheus.monitoring.svc.cluster.local:9090
  MEDIAMTX_NAMESPACE: streaming
  MEDIAMTX_POD_SELECTOR: app=mediamtx
  MEDIAMTX_METRICS_PORT: "9998"
  MEDIAMTX_CONTROL_SCHEME: http
  MEDIAMTX_CONTROL_PORT: "9997"
  MEDIAMTX_CONTROL_TIMEOUT: 5s
  MEDIAMTX_HEADLESS_SERVICE_NAME: mediamtx-headless
  MEDIAMTX_HLS_SCHEME: http
  MEDIAMTX_HLS_PORT: "8888"
  MEDIAMTX_SOURCE_ON_DEMAND: "true"
  KUBERNETES_CLUSTER_DOMAIN: cluster.local
  STREAM_GATEWAY_PORT: "8081"
  STREAM_PROVIDER: mediamtx
  DEFAULT_MAX_STREAMS: "500"
  DEFAULT_MAX_BANDWIDTH_MBPS: "5000"
  MEDIAMTX_STATEFULSET_NAME: mediamtx
  SCALER_INTERVAL: 15s
  SCALER_MIN_REPLICAS: "1"
  SCALER_MAX_REPLICAS: "20"
  SCALER_TARGET_UTILIZATION: "0.7"
  SCALER_BUFFER_REPLICAS: "1"
  COLLECT_TIMEOUT: 5s
  COLLECT_CONCURRENCY: "10"
  RECONCILE_INTERVAL: 10s
  HEARTBEAT_TIMEOUT: 30s
  LOG_LEVEL: info
  LOG_FORMAT: text
  DB_LOG_QUERIES: "false"
  DB_LOG_QUERY_ARGS: "false"
  DB_LOG_SQL: "false"
