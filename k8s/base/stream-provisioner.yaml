apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-provisioner
  namespace: orchestrator
  labels:
    app: stream-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-provisioner
  template:
    metadata:
      labels:
        app: stream-provisioner
    spec:
      containers:
        - name: stream-provisioner
          image: agj017/funnel-stream-provisioner:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: DB_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: RABBITMQ_URL
            - name: MEDIAMTX_CONTROL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: MEDIAMTX_CONTROL_USERNAME
            - name: MEDIAMTX_CONTROL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: MEDIAMTX_CONTROL_PASSWORD
