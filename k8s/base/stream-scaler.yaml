apiVersion: v1
kind: ServiceAccount
metadata:
  name: stream-scaler
  namespace: orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stream-scaler-statefulset-writer
  namespace: streaming
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stream-scaler-statefulset-writer
  namespace: streaming
subjects:
  - kind: ServiceAccount
    name: stream-scaler
    namespace: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stream-scaler-statefulset-writer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-scaler
  namespace: orchestrator
  labels:
    app: stream-scaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-scaler
  template:
    metadata:
      labels:
        app: stream-scaler
    spec:
      serviceAccountName: stream-scaler
      containers:
        - name: stream-scaler
          image: stream-orchestrator/stream-scaler:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: DB_URL
