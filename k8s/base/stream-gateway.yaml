apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-gateway
  namespace: orchestrator
  labels:
    app: stream-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-gateway
  template:
    metadata:
      labels:
        app: stream-gateway
    spec:
      containers:
        - name: stream-gateway
          image: agj017/funnel-stream-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: DB_URL
          ports:
            - name: http
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: stream-gateway
  namespace: orchestrator
  labels:
    app: stream-gateway
spec:
  selector:
    app: stream-gateway
  ports:
    - name: http
      port: 8081
      targetPort: http
