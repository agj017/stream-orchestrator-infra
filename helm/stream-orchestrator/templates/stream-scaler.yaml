apiVersion: v1
kind: ServiceAccount
metadata:
  name: stream-scaler
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stream-scaler-statefulset-writer
  namespace: {{ include "stream-orchestrator.streamingNamespace" . }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stream-scaler-statefulset-writer
  namespace: {{ include "stream-orchestrator.streamingNamespace" . }}
subjects:
  - kind: ServiceAccount
    name: stream-scaler
    namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stream-scaler-statefulset-writer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-scaler
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: stream-scaler
spec:
  replicas: {{ .Values.components.streamScaler.replicas }}
  selector:
    matchLabels:
      app: stream-scaler
  template:
    metadata:
      labels:
        app: stream-scaler
    spec:
      serviceAccountName: stream-scaler
      containers:
        - name: stream-scaler
          image: {{ include "stream-orchestrator.image" (list . .Values.components.streamScaler.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stream-orchestrator.dbSecretName" . }}
                  key: {{ include "stream-orchestrator.dbSecretKey" . }}

