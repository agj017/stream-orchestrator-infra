apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-gateway
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: stream-gateway
spec:
  replicas: {{ .Values.components.streamGateway.replicas }}
  selector:
    matchLabels:
      app: stream-gateway
  template:
    metadata:
      labels:
        app: stream-gateway
    spec:
      containers:
        - name: stream-gateway
          image: {{ include "stream-orchestrator.image" (list . .Values.components.streamGateway.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stream-orchestrator.dbSecretName" . }}
                  key: {{ include "stream-orchestrator.dbSecretKey" . }}
          ports:
            - name: http
              containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: stream-gateway
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: stream-gateway
spec:
  selector:
    app: stream-gateway
  ports:
    - name: http
      port: 8081
      targetPort: http

