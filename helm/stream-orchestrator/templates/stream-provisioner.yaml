apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-provisioner
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: stream-provisioner
spec:
  replicas: {{ .Values.components.streamProvisioner.replicas }}
  selector:
    matchLabels:
      app: stream-provisioner
  template:
    metadata:
      labels:
        app: stream-provisioner
    spec:
      containers:
        - name: stream-provisioner
          image: {{ include "stream-orchestrator.image" (list . .Values.components.streamProvisioner.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stream-orchestrator.dbSecretName" . }}
                  key: {{ include "stream-orchestrator.dbSecretKey" . }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stream-orchestrator.rabbitmqSecretName" . }}
                  key: {{ include "stream-orchestrator.rabbitmqSecretKey" . }}
            - name: MEDIAMTX_CONTROL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: MEDIAMTX_CONTROL_USERNAME
            - name: MEDIAMTX_CONTROL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: MEDIAMTX_CONTROL_PASSWORD

