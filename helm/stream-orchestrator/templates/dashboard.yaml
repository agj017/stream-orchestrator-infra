apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: dashboard
spec:
  replicas: {{ .Values.components.dashboard.replicas }}
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: {{ include "stream-orchestrator.image" (list . .Values.components.dashboard.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: dashboard
spec:
  selector:
    app: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http

