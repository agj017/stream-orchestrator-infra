{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: stream-orchestrator-migrate
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: stream-orchestrator-migrate
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        app: stream-orchestrator-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "stream-orchestrator.image" (list . .Values.migration.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stream-orchestrator.dbSecretName" . }}
                  key: {{ include "stream-orchestrator.dbSecretKey" . }}
          args:
            - -path=/migrations
            - -database=$(DB_URL)
            - up
{{- end }}

