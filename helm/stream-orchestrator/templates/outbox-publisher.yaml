apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: {{ include "stream-orchestrator.orchestratorNamespace" . }}
  labels:
    app: outbox-publisher
spec:
  replicas: {{ .Values.components.outboxPublisher.replicas }}
  selector:
    matchLabels:
      app: outbox-publisher
  template:
    metadata:
      labels:
        app: outbox-publisher
    spec:
      containers:
        - name: outbox-publisher
          image: {{ include "stream-orchestrator.image" (list . .Values.components.outboxPublisher.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: orchestrator-config
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stream-orchestrator.dbSecretName" . }}
                  key: {{ include "stream-orchestrator.dbSecretKey" . }}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "stream-orchestrator.rabbitmqSecretName" . }}
                  key: {{ include "stream-orchestrator.rabbitmqSecretKey" . }}

