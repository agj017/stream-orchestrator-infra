---
bootstrap_timezone: Asia/Seoul
bootstrap_manage_hosts_file: false
bootstrap_manage_firewall: false
bootstrap_time_sync_package: ""
bootstrap_time_sync_service: systemd-timesyncd

bootstrap_required_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - lsb-release
  - python3
  - python3-debian
  - software-properties-common

bootstrap_kernel_modules:
  - overlay
  - br_netfilter

bootstrap_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"

bootstrap_mount_points:
  - path: /var/lib/containerd
    owner: root
    group: root
    mode: "0755"
  - path: /var/lib/kubelet
    owner: root
    group: root
    mode: "0755"
  - path: /var/lib/orchestrator
    owner: root
    group: root
    mode: "0755"

containerd_package_name: containerd
containerd_config_path: /etc/containerd/config.toml

kubernetes_minor_version: "1.34"
kubernetes_apt_repository_url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/"
kubernetes_packages:
  - kubelet
  - kubeadm
  - kubectl
kubernetes_pause_image: registry.k8s.io/pause:3.10

firewall_allowed_tcp_ports:
  - "6443"
  - "2379"
  - "2380"
  - "10250"
  - "10257"
  - "10259"
  - "30000:32767"
